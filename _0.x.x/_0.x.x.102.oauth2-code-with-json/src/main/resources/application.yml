server:
  port: 9001

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/authorization_server?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    database: MYSQL #h2
    database-platform: org.hibernate.dialect.MySQL8Dialect #org.hibernate.dialect.H2Dialect        
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
        format_sql: true
        show_sql: true
        use_sql_comments: true
  jackson:
    serialization:
      indent-output: true

logging:
  level:
    root: INFO
    web: TRACE
    org.springframework.security: TRACE
    org.springframework: DEBUG
    #org.springframework.web: INFO
    org.springframework.beans.factory: INFO
    org.springframework.context.annotation.ClassPathBeanDefinitionScanner: INFO
    #org.springframework.security: INFO
    org.springframework.security.jackson2.SecurityJackson2Modules: INFO
    #org.springframework.security.oauth2: INFO
    #org.springframework.boot.autoconfigure: DEBUG
    org.springframework.boot.SpringApplication: INFO
    org.springframework.jdbc.datasource.init: INFO
    org.springframework.context.support.DefaultLifecycleProcessor: INFO
    org.springframework.boot.autoconfigure.logging: INFO
    org.hibernate: INFO
    sample: TRACE
    sample.config.provider.consent: TRACE

authorization:
  jwt:
    access-token-expire-time: 30000000
    header: Authorization
    prefix: "Bearer "
    refresh-token-expire-time: 2592000000
    key: MD0rgsDaSEZcKyQJqIDrKiV62p+ZhRCJvwOfvLIoGUSTkKCKCDgQQs2RQ8K9N4o36WIcf92ALn+yAUHgIJFDzg==
    refresh-key: S1YnkwxhpZsIyGeLkFuuRAGOzy2QsiQkIA/Hqyn39+mzFCK/V/uv/qUnMORRsy2TE1Z8MhYPwBxFYc41PJWf7g==
  server:
    #issuer: "https://www.lnkdoc.cn"
    issuer: "http://localhost:9001"
    authorization-endpoint: /oauth2/authorize
    oidc-user-info-endpoint: /api/userinfo
    token-endpoint: /oauth2/token
    jwk-set-endpoint: /.well-known/jwks.json
    openid-configuration: /.well-known/openid-configuration
  security:
    permit-uri: 
      - /error
      - /api/authentication/login
      - /login
      - /api/.well-known/openid-configuration